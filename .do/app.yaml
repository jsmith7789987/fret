# DigitalOcean App Platform spec for fret.
# Set secret values in the DO dashboard (or `doctl`) — never commit them.
name: fret
region: nyc

services:
  - name: web
    github:
      repo: jsmith7789987/fret
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLERK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_ACCOUNT_ID
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_CLOUDFLARE_ACCOUNT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLOUDFLARE_STREAM_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_R2_BUCKET_NAME
        scope: RUN_TIME
        type: SECRET
      - key: CLOUDFLARE_R2_PUBLIC_URL
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_PHONE_NUMBER
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TYPESENSE_HOST
        scope: RUN_TIME
        type: SECRET
      - key: TYPESENSE_PORT
        scope: RUN_TIME
        value: "8108"
      - key: TYPESENSE_PROTOCOL
        scope: RUN_TIME
        value: "http"
      - key: TYPESENSE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET

jobs:
  # Warms the AI match-scoring pass on each deploy. App Platform has no native
  # hourly scheduler, so for recurring scoring use an external cron (or a
  # DigitalOcean Functions scheduled trigger) hitting the same endpoint:
  #   curl -X POST "$NEXT_PUBLIC_APP_URL/api/listings/score" \
  #     -H "Authorization: Bearer $CRON_SECRET"
  - name: match-scoring
    kind: POST_DEPLOY
    github:
      repo: jsmith7789987/fret
      branch: main
    run_command: >-
      curl -fsS -X POST "$NEXT_PUBLIC_APP_URL/api/listings/score"
      -H "Authorization: Bearer $CRON_SECRET"
    environment_slug: node-js
    instance_size_slug: basic-xxs
    envs:
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_TIME
        type: SECRET
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
